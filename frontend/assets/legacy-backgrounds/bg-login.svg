<svg width="1920" height="1080" viewBox="0 0 1920 1080"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="45%" stop-color="#9da5b1" stop-opacity="0.035"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

  </defs>

  <rect width="1920" height="1080" fill="#07090d"/>

  <circle cx="960" cy="520" r="520" fill="url(#glow)"/>

  <!-- neural connections -->

  <g stroke="url(#line)" stroke-width="2">

    <line x1="400" y1="300" x2="760" y2="450"/>
    <line x1="760" y1="450" x2="1050" y2="280"/>
    <line x1="1050" y1="280" x2="1420" y2="430"/>

    <line x1="430" y1="700" x2="760" y2="450"/>
    <line x1="760" y1="450" x2="980" y2="720"/>
    <line x1="980" y1="720" x2="1400" y2="650"/>

    <line x1="1050" y1="280" x2="980" y2="720"/>
    <line x1="1420" y1="430" x2="1400" y2="650"/>

  </g>

  <!-- nodes -->

  <g fill="#dfe3e8">

    <circle cx="400" cy="300" r="5"/>
    <circle cx="760" cy="450" r="9"/>
    <circle cx="1050" cy="280" r="6"/>
    <circle cx="1420" cy="430" r="5"/>

    <circle cx="430" cy="700" r="4"/>
    <circle cx="980" cy="720" r="8"/>
    <circle cx="1400" cy="650" r="5"/>

  </g>

  <!-- floating particles -->

  <g fill="#ffffff" opacity="0.25">

    <circle cx="230" cy="180" r="2"/>
    <circle cx="580" cy="170" r="2"/>
    <circle cx="1320" cy="180" r="2"/>
    <circle cx="1580" cy="300" r="2"/>
    <circle cx="250" cy="850" r="2"/>
    <circle cx="520" cy="920" r="2"/>
    <circle cx="1260" cy="900" r="2"/>
    <circle cx="1680" cy="760" r="2"/>

  </g>

</svg>