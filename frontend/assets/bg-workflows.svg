<svg width="1920" height="1080" viewBox="0 0 1920 1080"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <radialGradient id="workflowGlow">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <rect width="1920" height="1080" fill="#07090d"/>

  <circle
    cx="1100"
    cy="520"
    r="560"
    fill="url(#workflowGlow)"
  />

  <!-- workflow paths -->

  <g
    fill="none"
    stroke="#c9ced5"
    stroke-opacity="0.11"
    stroke-width="3">

    <path d="M250 500 C500 300 620 300 850 500"/>
    <path d="M850 500 C1050 700 1200 700 1450 470"/>
    <path d="M850 500 C1050 350 1200 330 1600 520"/>

  </g>

  <!-- nodes -->

  <g
    fill="#dfe3e8"
    opacity="0.7">

    <circle cx="250" cy="500" r="7"/>
    <circle cx="850" cy="500" r="12"/>
    <circle cx="1450" cy="470" r="8"/>
    <circle cx="1600" cy="520" r="6"/>

  </g>

  <!-- secondary nodes -->

  <g fill="#ffffff" opacity="0.25">

    <circle cx="450" cy="380" r="3"/>
    <circle cx="620" cy="350" r="3"/>
    <circle cx="1120" cy="640" r="3"/>
    <circle cx="1270" cy="650" r="3"/>
    <circle cx="1350" cy="350" r="3"/>

  </g>

</svg>